name: Release

# Push a tag like v1.0.0 to export the game on Windows, Linux and macOS and publish the archives as a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-2025-vs2026
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    env:
      # A CI machine has no sound card.
      SDL_AUDIODRIVER: dummy

    steps:
      - uses: actions/checkout@v4

      - name: Packages
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev

      - name: Packages
        if: matrix.os == 'macos'
        run: brew install ninja

      # Keep the tag in step with `engine` in wind_project.toml and with ci.yml.
      - uses: wismh/wind-engine/.github/actions/setup-wind@v0.2.4a

      # The Release export: the game with the SDK's shipping engine (no profiler, no wind-cli server).
      - name: Export the game (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'export'
          $log = Join-Path $PWD 'export.log'
          $p = Start-Process -Wait -PassThru -FilePath "$env:WIND_SDK_DIR\bin\wind_editor.exe" `
            -ArgumentList '--batch','--project',$PWD.Path,'--export',$out,'--log-file',$log
          Get-Content $log
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Export the game (Linux, macOS)
        if: matrix.os != 'windows'
        run: wind_editor --batch --project "$PWD" --export "$PWD/export" --log-file export.log

      - name: Archive
        shell: bash
        run: |
          name="electromagnetic-field-${{ github.ref_name }}-${{ matrix.os }}"
          find export -name '*.pdb' -delete
          mkdir -p dist
          if [ "${{ matrix.os }}" = windows ]; then
            (cd export && 7z a -tzip "../dist/$name.zip" .)
          else
            tar -czf "dist/$name.tar.gz" -C export .
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*

  publish:
    needs: export
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" --generate-notes
