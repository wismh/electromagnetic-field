name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-2025-vs2026
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    env:
      # A CI machine has no sound card.
      SDL_AUDIODRIVER: dummy

    steps:
      - uses: actions/checkout@v4

      # The game links the engine's static player libraries with SDL3 on Linux, which needs these headers.
      - name: Packages
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev

      - name: Packages
        if: matrix.os == 'macos'
        run: brew install ninja

      # Downloads the SDK of the engine version named in wind_project.toml and sets WIND_SDK_DIR. Pinned to that
      # engine release, so bump the tag together with `engine` in wind_project.toml.
      - uses: wismh/wind-engine/.github/actions/setup-wind@v0.2.4a

      # The game's own unit tests, built against the SDK (the same configure the editor runs).
      - name: Configure tests
        shell: bash
        run: |
          generator=()
          if [ "${{ matrix.os }}" != windows ]; then generator=(-G "Ninja Multi-Config"); fi
          cmake -S . -B build-editor "${generator[@]}" -DCMAKE_PREFIX_PATH="$WIND_SDK_DIR" \
            "-DCMAKE_CONFIGURATION_TYPES=DebugGame;Release"

      - name: Build tests
        run: cmake --build build-editor --config DebugGame --target electromagnetic_field_tests --parallel

      - name: Run tests
        run: ctest --test-dir build-editor -C DebugGame --output-on-failure

      # Builds and exports the game with the SDK's editor, without a window. Release is the build players get.
      - name: Export the game (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'export'
          $log = Join-Path $PWD 'export.log'
          $p = Start-Process -Wait -PassThru -FilePath "$env:WIND_SDK_DIR\bin\wind_editor.exe" `
            -ArgumentList '--batch','--project',$PWD.Path,'--export',$out,'--log-file',$log
          Get-Content $log
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Export the game (Linux, macOS)
        if: matrix.os != 'windows'
        run: wind_editor --batch --project "$PWD" --export "$PWD/export" --log-file export.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electromagnetic-field-${{ matrix.os }}
          path: |
            export
            !export/**/*.pdb
            export.log
